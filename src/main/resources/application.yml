server:
  port: 8080

logging:
  file:
    path: ./logs
  level:
    root: INFO
    com.contentpublish: DEBUG

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/content_publish?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: a1143693967
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1000MB

  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

deepseek:
  api-key: ${DEEPSEEK_API_KEY:your-api-key}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat

storage:
  type: local
  local:
    upload-path: ./uploads

playwright:
  headless: true
  pool-size: 3
  browser-state-dir: ./browser-states
